name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm install

      - id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - id: published
        run: |
          VERSION=$(npm view "${{ steps.pkg.outputs.name }}" version 2>/dev/null || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # bump ONLY if versions match
      - name: Auto bump version if needed
        if: steps.pkg.outputs.version == steps.published.outputs.version
        run: npm version patch --no-git-tag-version

      - name: Commit version bump
        if: steps.pkg.outputs.version == steps.published.outputs.version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add package.json package-lock.json || true
          git commit -m "chore: auto bump version" || exit 0
          git push

      - name: Publish to npm
        run: npm publish --provenance --access public
